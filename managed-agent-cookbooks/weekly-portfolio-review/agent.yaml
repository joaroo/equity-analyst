name: weekly-portfolio-review
description: |
  Full weekly stock analysis pipeline. The orchestrator parses the portfolio input, then runs
  parallel setup (market snapshot + catalyst calendar), followed by sequential fundamental
  analysis, technical analysis, portfolio management decisions, and notification delivery.
version: "2.0"
trigger: "command:/analyze"

orchestrator:
  tasks:
    portfolio-input:
      description: Parse user-provided portfolio text into structured JSON (no sub-agent)
      input: raw portfolio text (holdings with buy-in prices, watchlist, index funds, cash)
      output_schema:
        type: object
        properties:
          holdings:
            type: array
            items:
              properties:
                ticker: {type: string}
                name: {type: string}
                buy_in_price: {type: number}
                fractional: {type: boolean}
                currency: {type: string}
                exchange: {type: string}
          watchlist:
            type: array
            items:
              properties:
                ticker: {type: string}
                name: {type: string}
                watch_price: {type: number}
                currency: {type: string}
          index_funds:
            type: array
            items:
              properties:
                ticker: {type: string}
                allocation_pct: {type: number}
          cash_available: {type: number}
          cash_currency: {type: string}

    format-notification:
      description: Reformat markdown analysis report for delivery via the configured notification channel (no sub-agent)
      input: final markdown report from portfolio-manager subagent
      output: plaintext-friendly formatted string suitable for chat or email
      formatting_rules:
        - "## headings → *HEADING* (bold, no hashes — works across Telegram, Slack, email)"
        - "**text** → *text* (single asterisks for broad compatibility)"
        - "| table | rows → aligned plain text or bullet lists"
        - "--- horizontal rules → blank line"
        - "Preserve ✅ ⚠️ ❌ 🚨 emoji"
        - "Preserve numbered lists and bullet points"
        - "Keep triple-backtick code blocks"

pipeline:
  phase_0_parallel:
    description: "Market snapshot + catalyst calendar run simultaneously, after the orchestrator parses the portfolio"
    depends_on: [orchestrator.portfolio-input]
    steps:
      - subagent: market-snapshot
      - subagent: catalyst-scanner
        inputs:
          portfolio_json: "from:orchestrator.portfolio-input"

  phase_1:
    description: "Fundamental analysis — requires portfolio JSON + market context"
    depends_on: [phase_0_parallel]
    steps:
      - subagent: fundamental-analyst
        inputs:
          portfolio_json: "from:orchestrator.portfolio-input"
          market_context: "from:market-snapshot"

  phase_2:
    description: "Technical analysis — requires fundamental report + market context"
    depends_on: [phase_1]
    steps:
      - subagent: technical-analyst
        inputs:
          fundamental_report: "from:fundamental-analyst"
          market_context: "from:market-snapshot"
          portfolio_json: "from:orchestrator.portfolio-input"

  phase_3:
    description: "Portfolio manager decisions — requires both analyst reports"
    depends_on: [phase_2]
    steps:
      - subagent: portfolio-manager
        inputs:
          fundamental_report: "from:fundamental-analyst"
          technical_report: "from:technical-analyst"
          catalyst_calendar: "from:catalyst-scanner"

  phase_4:
    description: "Notification formatting and delivery — done by the orchestrator"
    depends_on: [phase_3]
    steps:
      - orchestrator: format-notification
        inputs:
          report: "from:portfolio-manager"

notifications:
  connector: notifications
  milestones:
    - after: phase_0_parallel
      message: "🔍 Step 0 done. Running fundamental analysis..."
    - after: phase_1
      message: "📊 Fundamental analysis done. Running technical analysis..."
    - after: phase_2
      message: "📈 Technical analysis done. Portfolio manager deciding..."
    - after: phase_3
      message: "✅ Analysis complete. Formatting final report..."

error_handling:
  on_failure: "send error notification via notifications connector (phase name + error message), then halt pipeline"
